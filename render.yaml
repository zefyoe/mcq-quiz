services:
  - type: web
    name: mcq-quiz-web
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --worker-class gthread --threads 4 --timeout 120 --keep-alive 5 --max-requests 500 --max-requests-jitter 50 --access-logfile - app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mcq-quiz-db
          property: connectionString
      - key: SITE_OFFLINE
        value: "1"

databases:
  - name: mcq-quiz-db
    plan: free
