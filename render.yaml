services:
  - type: web
    name: mcq-quiz-web
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 2 --worker-class gthread --threads 4 --timeout 120 --keep-alive 5 --access-logfile - app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mcq-quiz-db
          property: connectionString

databases:
  - name: mcq-quiz-db
    plan: free
