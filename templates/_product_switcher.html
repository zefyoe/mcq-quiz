{% set selected_product = active_product|default(product|default("anatomy")) %}
<nav class="product-switcher" aria-label="{{ 'Product kiezen' if language == 'nl' else 'Choose product' }}">
  <a
    href="{{ url_for('switch_product', product_key='anatomy') }}"
    class="product-option {% if selected_product != 'core' %}active{% endif %}"
  >
    <span aria-hidden="true">A</span>
    {{ "Anatomie" if language == "nl" else "Anatomy" }}
  </a>
  <a
    href="{{ url_for('switch_product', product_key='core') }}"
    class="product-option {% if selected_product == 'core' %}active{% endif %}"
  >
    <span aria-hidden="true">C</span>
    CORE
  </a>
</nav>
