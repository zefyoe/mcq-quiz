<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CORE {{ section.label }}</title>
    {% include "_favicon.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="core-product">
    <main class="core-empty-page">
      <section class="core-panel">
        <span class="core-brand-mark">C</span>
        <p class="eyebrow">CORE RADIOLOGY</p>
        <h1>{{ section.label }}</h1>
        <div class="core-empty-count">0/0</div>
        <p>{{ "Deze module is voorbereid en wordt later met cases gevuld." if language == "nl" else "This module is prepared and will be populated with cases later." }}</p>
        <a href="{{ url_for('core_home') }}" class="core-primary-button">{{ "Terug naar CORE" if language == "nl" else "Back to CORE" }}</a>
      </section>
    </main>
  </body>
</html>
